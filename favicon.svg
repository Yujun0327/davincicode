<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- manila folder ground -->
  <rect width="32" height="32" rx="3" fill="#E7D7A9"/>
  <!-- black cipher slip with its paper redaction bar -->
  <rect x="4.5" y="6" width="11" height="20" rx="2" fill="#17130E"/>
  <rect x="7" y="14.5" width="6" height="3" rx="0.8" fill="#F9F3E2" opacity="0.9"/>
  <!-- white cipher slip, numeral showing -->
  <rect x="16.5" y="6" width="11" height="20" rx="2" fill="#F9F3E2" stroke="#2B2620" stroke-width="1"/>
  <text x="22" y="20.5" text-anchor="middle" font-family="Courier, monospace" font-size="11" font-weight="bold" fill="#2B2620">7</text>
  <!-- the stamp strike -->
  <path d="M18 24 L26 8" stroke="#A6382E" stroke-width="1.6" stroke-linecap="round" opacity="0.85"/>
</svg>
